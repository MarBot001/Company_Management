<!-- src/main/resources/templates/new-employee.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Új alkalmazott</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<nav class="navbar navbar-expand bg-dark border-bottom border-body" data-bs-theme="dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Cégkezelő</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" aria-current="page" th:href="@{/}">Kezdőlap</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/companies/view}">Cégek listája</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/companies/new}">Új cég hozzáadása</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/employees/view}">Alkalmazottak listája</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/employees/new}">Új alkalmazott hozzáadása</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h1>Új alkalmazott hozzáadása</h1>
    <form th:action="@{/employees}" th:object="${employee}" method="post">
        <div class="mb-3">
            <label for="name" class="form-label">Név</label>
            <input type="text" th:field="*{name}" class="form-control" id="name" required>
        </div>
        <div class="mb-3">
            <label for="position" class="form-label">Beosztás</label>
            <input type="text" th:field="*{position}" class="form-control" id="position" required>
        </div>
        <div class="mb-3">
            <label for="company" class="form-label">Cég</label>
            <select th:field="*{company.id}" class="form-select" id="company" required>
                <option th:each="company : ${companies}" th:value="${company.id}" th:text="${company.name}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Mentés</button>
        <a th:href="@{/employees/view}" class="btn btn-secondary">Vissza</a>
    </form>
</div>
</body>
</html>
