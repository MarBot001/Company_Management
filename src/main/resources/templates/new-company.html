<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Új cég</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<nav class="navbar navbar-expand bg-dark border-bottom border-body" data-bs-theme="dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Cégkezelő</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" aria-current="page" th:href="@{/}">Kezdőlap</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/companies/view}">Cégek listája</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/companies/new}">Új cég hozzáadása</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/employees/view}">Alkalmazottak listája</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/employees/new}">Új alkalmazott hozzáadása</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">


<h1 class="mb-4">Új cég hozzáadása</h1>

<form th:action="@{/companies/save}" th:object="${company}" method="post">
    <div class="mb-3">
        <label class="form-label">Név</label>
        <input type="text" th:field="*{name}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Helyszín</label>
        <input type="text" th:field="*{location}" class="form-control">
    </div>
    <button type="submit" class="btn btn-success">Mentés</button>
    <a href="/companies/view" class="btn btn-secondary ms-2">Vissza</a>
</form>
</div>
</body>
</html>
