<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Új cég</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1 class="mb-4">Új cég hozzáadása</h1>

<form th:action="@{/companies/save}" th:object="${company}" method="post">
    <div class="mb-3">
        <label class="form-label">Név</label>
        <input type="text" th:field="*{name}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Helyszín</label>
        <input type="text" th:field="*{location}" class="form-control">
    </div>
    <button type="submit" class="btn btn-success">Mentés</button>
    <a href="/companies/view" class="btn btn-secondary ms-2">Vissza</a>
</form>
</body>
</html>
