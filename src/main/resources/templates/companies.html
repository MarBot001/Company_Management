<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
</head>
<body>

<section layout:fragment="content">
<h1 class="mb-4">Regisztrált cégek</h1>

<a href="/companies/new" class="btn btn-primary mb-3">Új cég hozzáadása</a>

  <table class="table table-striped mt-4">
    <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Location</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="company : ${companies}">
      <td th:text="${company.id}"></td>
      <td th:text="${company.name}"></td>
      <td th:text="${company.location}"></td>
      <td>
        <form th:action="@{'/companies/' + ${company.id}}" method="post"
              onsubmit="return confirm('Biztosan törölni szeretnéd?');">
          <input type="hidden" name="_method" value="delete"/>
          <button type="submit" class="btn btn-danger btn-sm">Törlés</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</section>
</body>
</html>
