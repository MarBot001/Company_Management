<!-- src/main/resources/templates/employees.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alkalmazottak</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<nav class="navbar navbar-expand bg-dark border-bottom border-body" data-bs-theme="dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Cégkezelő</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" aria-current="page" th:href="@{/}">Kezdőlap</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/companies/view}">Cégek listája</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/companies/new}">Új cég hozzáadása</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/employees/view}">Alkalmazottak listája</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/employees/new}">Új alkalmazott hozzáadása</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <h1 class="mb-4">Alkalmazottak</h1>
    <a class="btn btn-success mb-3" th:href="@{/employees/new}">Új alkalmazott hozzáadása</a>
    <table class="table table-bordered mt-4">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Position</th>
            <th>Company</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="employee : ${employees}">
            <td th:text="${employee.id}"></td>
            <td th:text="${employee.name}"></td>
            <td th:text="${employee.position}"></td>
            <td th:text="${employee.company.name}"></td>
            <td>
                <form th:action="@{'/employees/' + ${employee.id}}" method="post"
                      onsubmit="return confirm('Biztosan törölni szeretnéd?');">
                    <input type="hidden" name="_method" value="delete"/>
                    <button type="submit" class="btn btn-danger btn-sm">Törlés</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
